[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-search"
version = "0.1.0"
description = "Grocery product search on Google Cloud: Vertex AI Search retrieval with model-based re-ranking"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

[tool.setuptools]
packages = ["grocery_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
